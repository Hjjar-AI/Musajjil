{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-database"></i> استعادة نسخة احتياطية</h2>
<div class="table--responsive">
    <table class="table table--bordered">
        <thead class="table__header">
            <tr><th>اسم الملف</th><th>الحجم</th><th>تاريخ التعديل</th><th></th></tr>
        </thead>
        <tbody>
            {% for b in backups %}
            <tr>
                <td>{{ b.filename }}</td>
                <td>{{ (b.size / 1024)|round(1) }} KB</td>
                <td>{{ b.modified }}</td>
                <td>
                    <form method="POST" action="{{ url_for('maintenance.restore_backup', filename=b.filename) }}" onsubmit="return confirm('سيتم استبدال قاعدة البيانات الحالية. هل أنت متأكد؟')">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-sm btn-warning">استعادة</button>
                    </form>
                 </td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center">لا توجد نسخ احتياطية</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-secondary">عودة</a>
{% endblock %}
