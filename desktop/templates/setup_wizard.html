{% extends "base.html" %}
{% block content %}
<h2>الإعداد الأولي</h2>
<form method="POST" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card mb-4">
        <div class="card__header bg-primary text-white">التصنيفات والاستحقاقات</div>
        <div class="card__body">
            <div id="classifications-container" data-vac-types='{{ vac_types|tojson }}'>
                <div class="row mb-3 classification-row g-2">
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="classification_name" placeholder="اسم التصنيف (مثال: طبيب)" required>
                    </div>
                    <div class="col-md-9">
                        <div class="row g-2">
                            {% for vt in vac_types %}
                            <div class="col-md-3">
                                <label>{{ vt.name }}</label>
                                <input type="number" step="0.5" class="form-control" name="ent_0_{{ vt.id }}" value="0">
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-action="add-classification">+ إضافة تصنيف</button>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card__header bg-primary text-white">معايير التقييم العامة</div>
        <div class="card__body">
            <div id="criteria-container">
                <div class="mb-2"><input type="text" class="form-control" name="general_criteria" placeholder="معيار تقييم (مثال: الأداء الوظيفي)"></div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-action="add-criteria">+ إضافة معيار</button>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card__header bg-primary text-white">حساب المدير</div>
        <div class="card__body">
            <div class="mb-3">
                <label class="form-label">كلمة مرور المدير</label>
                <input type="password" class="form-control" name="admin_password" placeholder="اترك فارغاً لإنشاء كلمة عشوائية">
                <div class="form-text">سيتم إنشاء حساب مدير إذا لم يكن موجوداً مسبقاً.</div>
            </div>
        </div>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">حفظ الإعدادات</button>
    </div>
</form>
{% endblock %}
