{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-tools ms-1"></i>أدوات التقييم</h2>
<div class="card mb-4"><div class="card__body"><form action="{{ url_for('evaluations.add_tool') }}" class="row g-2 row g-3" method="POST">
<input name="csrf_token" type="hidden" value="{{ csrf_token() }}"/><div class="col-md-6"><label class="form-label">اسم الأداة</label><input class="form-control" name="name" placeholder="مثال: Mini-CEX" required="" type="text"/></div><div class="col-md-3"><label class="form-label">التكرار المقترح (كل … شهر)</label><input class="form-control" min="0.5" name="frequency" required="" step="0.5" type="number" value="1"/></div><div class="col-md-3 align-self-end"><button class="btn btn-primary" type="submit"><i class="bi bi-plus-circle ms-1"></i>إضافة</button></div></form></div></div>
<div class="table--responsive"><table class="table table--bordered"><thead class="table__header"><tr><th>الأداة</th><th>التكرار (شهر)</th><th>المعايير</th><th></th></tr></thead><tbody>{% for tool in tools %}运转<form action="{{ url_for('evaluations.edit_tool', id=tool.id) }}" class="d-contents row g-3" method="POST">
<input name="csrf_token" type="hidden" value="{{ csrf_token() }}"/><td><input class="form-control form-control-sm" name="name" required="" type="text" value="{{ tool.name }}"/></td><td><input class="form-control form-control-sm" min="0.5" name="frequency" required="" step="0.5" type="number" value="{{ tool.suggested_frequency_months }}"/></td><td><a class="btn btn-sm btn-outline-secondary" href="{{ url_for('evaluations.tool_criteria', tool_id=tool.id) }}"><i class="bi bi-list-ul ms-1"></i>إدارة المعايير</a></td><td><div class="btn-group btn-group-sm"><button class="btn btn-outline-primary" title="حفظ" type="submit"><i class="bi bi-check-lg"></i></button></div></td></form><td>
<form action="{{ url_for('evaluations.delete_tool', id=tool.id) }}" method="POST" data-confirm-message="حذف الأداة {{ tool.name }}؟">
    <input name="csrf_token" type="hidden" value="{{ csrf_token() }}"/>
    <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i> حذف</button>
</form>
</td>
</tr>
{% endfor %}</tbody>
</table>
</div>
{% endblock %}
