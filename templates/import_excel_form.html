{% extends "base.html" %}
{% block content %}
<h2>استيراد موظفين من Excel</h2>
<form class="row g-3" enctype="multipart/form-data" method="POST">
    <input name="csrf_token" type="hidden" value="{{ csrf_token() }}"/>
    <div class="mb-3">
        <label class="form-label">ملف Excel (.xlsx)</label>
        <input accept=".xlsx" class="form-control" name="file" required="" type="file"/>
    </div>
    <button class="btn btn-primary" type="submit">استيراد</button>
</form>
{% endblock %}
