{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-play-circle ms-1"></i>بدء التقييمات</h2>
<div class="card mb-4">
    <div class="card__body">
        <form method="GET" class="row g-3">
            <div class="col-md-4">
                <label class="form-label">التصنيف</label>
                <select class="form-select" name="classification">
                    <option value="">الكل</option>
                    {% for c in classifications %}<option value="{{ c.id }}" {% if selected_classification == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">الوسم</label>
                <select class="form-select" name="tag">
                    <option value="">الكل</option>
                    {% for t in tags %}<option value="{{ t.id }}" {% if selected_tag == t.id %}selected{% endif %}>{{ t.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-2 align-self-end">
                <button type="submit" class="btn btn-primary"><i class="bi bi-funnel ms-1"></i>تصفية</button>
            </div>
        </form>
    </div>
</div>
<div class="row">
    {% for emp in employees %}
    <div class="col-md-6 col-lg-4 mb-3">
        <div class="card h-100">
            <div class="card__body">
                <h5 class="card__title">{{ emp.name or 'موظف ' + emp.id|string }}</h5>
                {% if emp.classification_name %}<p class="card__text"><strong>التصنيف:</strong> {{ emp.classification_name }}</p>{% endif %}
                <a href="{{ url_for('evaluations.add', id=emp.id) }}" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle ms-1"></i>إضافة تقييم</a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12"><div class="alert alert-info">لا يوجد موظفين مطابقين للتصفية.</div></div>
    {% endfor %}
</div>
{% endblock %}
